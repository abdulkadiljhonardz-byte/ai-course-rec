<!DOCTYPE html>
<html lang="en-PH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MSU-Sulu course recommendation guide based on grades, interests, strengths, and skills.">
  <meta name="theme-color" content="#0e7490">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Course Guide">
  <title>MSU-Sulu Course Guide</title>
  <link rel="icon" type="image/png" href="web/favicon.png">
  <link rel="apple-touch-icon" href="web/icons/Icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #dce7ef;
      --surface: #ffffff;
      --surface-soft: #eef4f8;
      --surface-strong: #d9e8f2;
      --line: #d6dee6;
      --text: #12212f;
      --muted: #627487;
      --primary: #0e7490;
      --primary-deep: #115e73;
      --primary-soft: #c8ebf4;
      --accent: #2494a7;
      --danger: #c2410c;
      --shadow: 0 20px 50px rgba(20, 41, 61, 0.12);
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-pill: 999px;
      --shell-width: 460px;
      --font: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, rgba(36, 148, 167, 0.14), transparent 35%),
        linear-gradient(180deg, #edf4f8 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      padding: 20px;
    }

    .shell {
      width: min(100%, var(--shell-width));
      min-height: calc(100vh - 40px);
      margin: 0 auto;
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      padding: 18px 18px 16px;
      border-bottom: 1px solid rgba(214, 222, 230, 0.9);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-button,
    .icon-button {
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      border-radius: 12px;
      padding: 8px 10px;
      font: inherit;
    }

    .back-button:hover,
    .icon-button:hover {
      background: var(--surface-soft);
    }

    .title-wrap {
      min-width: 0;
      flex: 1;
    }

    .screen-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .screen-subtitle {
      margin: 4px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: linear-gradient(180deg, #f5f8fb 0%, #eef4f8 100%);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero {
      border-radius: var(--radius-lg);
      padding: 18px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #fff;
    }

    .hero h2,
    .card h3,
    .section-heading {
      margin: 0;
    }

    .hero p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.9rem;
    }

    .card,
    .sheet {
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid rgba(214, 222, 230, 0.7);
      box-shadow: 0 6px 20px rgba(18, 33, 47, 0.04);
    }

    .card-body {
      padding: 16px;
    }

    .soft-panel {
      padding: 12px;
      border-radius: var(--radius-md);
      background: rgba(217, 232, 242, 0.58);
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 0.8rem;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-heading {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label.input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      font: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.12);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 12px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .chip.selected {
      background: var(--primary-soft);
      color: var(--primary-deep);
      border-color: rgba(14, 116, 144, 0.22);
      font-weight: 700;
    }

    .button {
      border: 0;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .button-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
    }

    .button-primary:hover {
      background: var(--primary-deep);
    }

    .button-secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .button-danger {
      background: #fff3ed;
      color: var(--danger);
      border: 1px solid rgba(194, 65, 12, 0.16);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid rgba(214, 222, 230, 0.7);
      padding: 14px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(18, 33, 47, 0.035);
    }

    .list-item h4 {
      margin: 0;
      font-size: 0.98rem;
    }

    .list-item p {
      margin: 8px 0 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: var(--radius-pill);
      background: #f2f6f9;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .summary-badge {
      background: var(--primary-soft);
      color: var(--primary-deep);
    }

    .progress {
      height: 8px;
      width: 100%;
      border-radius: 999px;
      background: #dbe6ee;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: inherit;
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      border-top: 1px solid rgba(214, 222, 230, 0.9);
      background: rgba(255, 255, 255, 0.98);
    }

    .nav-item {
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: var(--muted);
      padding: 11px 8px;
      cursor: pointer;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      transition: 0.18s ease;
    }

    .nav-item.active {
      background: var(--primary-soft);
      color: var(--primary-deep);
    }

    .hidden {
      display: none !important;
    }

    .empty-state {
      text-align: center;
      padding: 42px 18px;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.46);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      z-index: 40;
    }

    .sheet {
      width: min(100%, 460px);
      max-height: min(82vh, 720px);
      overflow-y: auto;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .sheet-head,
    .sheet-body {
      padding: 18px;
    }

    .sheet-head {
      border-bottom: 1px solid rgba(214, 222, 230, 0.8);
    }

    .history-head {
      align-items: flex-start;
    }

    .result-rank {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-soft);
      color: var(--primary-deep);
      font-weight: 800;
      flex: 0 0 auto;
    }

    .history-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .danger-text {
      color: var(--danger);
    }

    .footer-note {
      margin-top: 4px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
      }

      .shell {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .modal {
        padding: 0;
      }

      .sheet {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button id="backButton" class="back-button hidden" type="button">Back</button>
      <div class="title-wrap">
        <h1 id="screenTitle" class="screen-title">Recommend</h1>
        <p id="screenSubtitle" class="screen-subtitle">Find your best-fit program</p>
      </div>
    </header>

    <main id="content" class="content"></main>

    <nav id="bottomNav" class="bottom-nav">
      <button class="nav-item active" data-screen="recommend" type="button">Recommend</button>
      <button class="nav-item" data-screen="courses" type="button">Courses</button>
      <button class="nav-item" data-screen="history" type="button">History</button>
    </nav>
  </div>

  <div id="modalRoot" class="hidden"></div>

  <script>
    const STORAGE_KEY = "msu_sulu_course_history_v1";

    const interestOptions = [
      "Technology",
      "Health",
      "Business",
      "Education",
      "Agriculture",
      "Social Science",
      "Language"
    ];

    const strengthOptions = [
      "Analytical Thinking",
      "Communication",
      "Leadership",
      "Discipline",
      "Creativity",
      "Empathy"
    ];

    const skillOptions = [
      "Problem Solving",
      "Basic Coding",
      "Writing",
      "Public Speaking",
      "Research",
      "Teamwork"
    ];

    const weaknessOptions = [
      "Math Difficulty",
      "Science Difficulty",
      "English Difficulty",
      "Time Management",
      "Shyness",
      "Test Anxiety"
    ];

    const categoryStrengthFit = {
      Technology: ["Analytical Thinking", "Creativity", "Discipline"],
      Health: ["Empathy", "Discipline", "Communication"],
      Business: ["Leadership", "Communication", "Analytical Thinking"],
      Education: ["Communication", "Empathy", "Creativity"],
      Agriculture: ["Discipline", "Analytical Thinking", "Creativity"],
      "Social Science": ["Communication", "Leadership", "Empathy"],
      Language: ["Communication", "Creativity", "Empathy"]
    };

    const categorySkillFit = {
      Technology: ["Basic Coding", "Problem Solving", "Research"],
      Health: ["Research", "Teamwork", "Problem Solving"],
      Business: ["Public Speaking", "Writing", "Teamwork"],
      Education: ["Public Speaking", "Writing", "Teamwork"],
      Agriculture: ["Research", "Problem Solving", "Teamwork"],
      "Social Science": ["Writing", "Public Speaking", "Research"],
      Language: ["Writing", "Public Speaking", "Research"]
    };

    const categoryWeaknessRisk = {
      Technology: ["Math Difficulty", "Science Difficulty", "Time Management"],
      Health: ["Science Difficulty", "Test Anxiety", "Time Management"],
      Business: ["English Difficulty", "Shyness", "Time Management"],
      Education: ["English Difficulty", "Shyness", "Time Management"],
      Agriculture: ["Science Difficulty", "Time Management"],
      "Social Science": ["English Difficulty", "Shyness"],
      Language: ["English Difficulty", "Shyness"]
    };

    const courses = [
      {
        code: "BSAGRI",
        name: "BS in Agriculture",
        category: "Agriculture",
        description: "Crop and farm management, production systems, and sustainability."
      },
      {
        code: "BSABM",
        name: "BS in Agri-Business Management",
        category: "Business",
        description: "Business operations, planning, and entrepreneurship for agri-based industries."
      },
      {
        code: "BSNUR",
        name: "BS in Nursing",
        category: "Health",
        description: "Clinical care, patient safety, and community health practice."
      },
      {
        code: "BSBIO",
        name: "BS in Biology",
        category: "Health",
        description: "Biological sciences, laboratory methods, and scientific analysis."
      },
      {
        code: "BSMATH",
        name: "BS in Mathematics",
        category: "Technology",
        description: "Mathematical reasoning, modeling, and quantitative problem solving."
      },
      {
        code: "BAELS",
        name: "BA in English Language Studies",
        category: "Language",
        description: "Communication, linguistics, writing, and language instruction."
      },
      {
        code: "BAIS",
        name: "BA in Islamic Studies",
        category: "Social Science",
        description: "Islamic thought, culture, ethics, and social perspectives."
      },
      {
        code: "BAPOLS",
        name: "BA in Political Science",
        category: "Social Science",
        description: "Governance, policy analysis, and public affairs."
      },
      {
        code: "BSBA",
        name: "BS in Business Administration",
        category: "Business",
        description: "Management, marketing, and strategic business decision-making."
      },
      {
        code: "BSA",
        name: "BS in Accountancy",
        category: "Business",
        description: "Financial reporting, auditing, and accounting standards."
      },
      {
        code: "BSIT",
        name: "BS in Information Technology",
        category: "Technology",
        description: "Software, systems, networking, and practical IT solutions."
      },
      {
        code: "BSCS",
        name: "BS in Computer Science",
        category: "Technology",
        description: "Algorithms, programming, and computer systems fundamentals."
      },
      {
        code: "BSED",
        name: "Bachelor of Secondary Education",
        category: "Education",
        description: "Teaching methods and subject mastery for secondary learners."
      },
      {
        code: "BEED",
        name: "Bachelor of Elementary Education",
        category: "Education",
        description: "Child-centered teaching and foundational learning support."
      }
    ];

    const rules = [
      { courseCode: "BSAGRI", minMath: 70, minScience: 75, minEnglish: 70, weightMath: 0.30, weightScience: 0.45, weightEnglish: 0.25, preferredInterest: "Agriculture" },
      { courseCode: "BSABM", minMath: 70, minScience: 70, minEnglish: 75, weightMath: 0.30, weightScience: 0.20, weightEnglish: 0.50, preferredInterest: "Business" },
      { courseCode: "BSNUR", minMath: 75, minScience: 85, minEnglish: 80, weightMath: 0.25, weightScience: 0.50, weightEnglish: 0.25, preferredInterest: "Health" },
      { courseCode: "BSBIO", minMath: 75, minScience: 82, minEnglish: 75, weightMath: 0.25, weightScience: 0.50, weightEnglish: 0.25, preferredInterest: "Health" },
      { courseCode: "BSMATH", minMath: 85, minScience: 75, minEnglish: 70, weightMath: 0.55, weightScience: 0.25, weightEnglish: 0.20, preferredInterest: "Technology" },
      { courseCode: "BAELS", minMath: 65, minScience: 65, minEnglish: 85, weightMath: 0.10, weightScience: 0.15, weightEnglish: 0.75, preferredInterest: "Language" },
      { courseCode: "BAIS", minMath: 65, minScience: 65, minEnglish: 80, weightMath: 0.10, weightScience: 0.20, weightEnglish: 0.70, preferredInterest: "Social Science" },
      { courseCode: "BAPOLS", minMath: 68, minScience: 70, minEnglish: 82, weightMath: 0.15, weightScience: 0.25, weightEnglish: 0.60, preferredInterest: "Social Science" },
      { courseCode: "BSBA", minMath: 70, minScience: 68, minEnglish: 78, weightMath: 0.25, weightScience: 0.20, weightEnglish: 0.55, preferredInterest: "Business" },
      { courseCode: "BSA", minMath: 80, minScience: 72, minEnglish: 80, weightMath: 0.45, weightScience: 0.15, weightEnglish: 0.40, preferredInterest: "Business" },
      { courseCode: "BSIT", minMath: 80, minScience: 75, minEnglish: 70, weightMath: 0.45, weightScience: 0.35, weightEnglish: 0.20, preferredInterest: "Technology" },
      { courseCode: "BSCS", minMath: 85, minScience: 80, minEnglish: 70, weightMath: 0.50, weightScience: 0.35, weightEnglish: 0.15, preferredInterest: "Technology" },
      { courseCode: "BSED", minMath: 72, minScience: 72, minEnglish: 78, weightMath: 0.30, weightScience: 0.30, weightEnglish: 0.40, preferredInterest: "Education" },
      { courseCode: "BEED", minMath: 70, minScience: 70, minEnglish: 80, weightMath: 0.25, weightScience: 0.25, weightEnglish: 0.50, preferredInterest: "Education" }
    ];

    const routeMeta = {
      recommend: {
        title: "Recommend",
        subtitle: "Find your best-fit program"
      },
      courses: {
        title: "Courses",
        subtitle: "Explore all available programs"
      },
      history: {
        title: "History",
        subtitle: "Review your previous results"
      },
      results: {
        title: "Recommendations",
        subtitle: ""
      }
    };

    const state = {
      currentScreen: "recommend",
      selectedInterest: interestOptions[0],
      selectedStrengths: new Set(),
      selectedSkills: new Set(),
      selectedWeaknesses: new Set(),
      courseQuery: "",
      resultsSession: null
    };

    const content = document.getElementById("content");
    const screenTitle = document.getElementById("screenTitle");
    const screenSubtitle = document.getElementById("screenSubtitle");
    const bottomNav = document.getElementById("bottomNav");
    const backButton = document.getElementById("backButton");
    const modalRoot = document.getElementById("modalRoot");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function clampScore(value) {
      if (value < 0) return 0;
      if (value > 100) return 100;
      return value;
    }

    function weightedAcademicScore(math, science, english, weightMath, weightScience, weightEnglish) {
      const totalWeight = weightMath + weightScience + weightEnglish;
      if (!totalWeight) return 0;
      return ((math * weightMath) + (science * weightScience) + (english * weightEnglish)) / totalWeight;
    }

    function shortfallPenalty(grade, minRequired) {
      const deficit = minRequired - grade;
      return deficit > 0 ? deficit * 0.7 : 0;
    }

    function profileBonus(category, strengths, skills) {
      const preferredStrengths = categoryStrengthFit[category] || [];
      const preferredSkills = categorySkillFit[category] || [];
      const matchedStrengths = strengths.filter((item) => preferredStrengths.includes(item)).length;
      const matchedSkills = skills.filter((item) => preferredSkills.includes(item)).length;
      return (matchedStrengths * 2) + (matchedSkills * 2);
    }

    function weaknessPenalty(category, weaknesses) {
      const riskWeaknesses = categoryWeaknessRisk[category] || [];
      const matches = weaknesses.filter((item) => riskWeaknesses.includes(item)).length;
      return matches * 2.5;
    }

    function generateRecommendations(input) {
      const results = rules.map((rule) => {
        const course = courses.find((item) => item.code === rule.courseCode);
        const weightedAverage = weightedAcademicScore(
          input.mathGrade,
          input.scienceGrade,
          input.englishGrade,
          rule.weightMath,
          rule.weightScience,
          rule.weightEnglish
        );

        const readinessPenalty =
          shortfallPenalty(input.mathGrade, rule.minMath) +
          shortfallPenalty(input.scienceGrade, rule.minScience) +
          shortfallPenalty(input.englishGrade, rule.minEnglish);

        const interestMatched = input.interest === rule.preferredInterest;
        const interestBonus = interestMatched ? 12 : 0;
        const cetBonus = input.cetScore === null ? 0 : (Math.max(0, Math.min(100, input.cetScore)) / 100) * 8;
        const plusProfile = profileBonus(course.category, input.strengths, input.skills);
        const minusProfile = weaknessPenalty(course.category, input.weaknesses);
        const score = clampScore(weightedAverage - readinessPenalty + interestBonus + cetBonus + plusProfile - minusProfile);

        return {
          course,
          score,
          interestMatched
        };
      });

      results.sort((a, b) => b.score - a.score);
      return results;
    }

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (_) {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function storeSession(input, results) {
      const history = loadHistory();
      history.unshift({
        id: Date.now(),
        createdAt: new Date().toISOString(),
        studentName: input.studentName,
        mathGrade: input.mathGrade,
        scienceGrade: input.scienceGrade,
        englishGrade: input.englishGrade,
        cetScore: input.cetScore,
        interest: input.interest,
        strengths: input.strengths,
        skills: input.skills,
        weaknesses: input.weaknesses,
        results: results.slice(0, 5)
      });
      saveHistory(history);
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return year + "-" + month + "-" + day + " " + hour + ":" + minute;
    }

    function scoreMetaChip(label) {
      return '<span class="badge">' + escapeHtml(label) + "</span>";
    }

    function render() {
      const meta = routeMeta[state.currentScreen];
      screenTitle.textContent = meta.title;
      screenSubtitle.textContent = meta.subtitle;
      screenSubtitle.classList.toggle("hidden", !meta.subtitle);
      backButton.classList.toggle("hidden", state.currentScreen !== "results");
      bottomNav.classList.toggle("hidden", state.currentScreen === "results");

      document.querySelectorAll(".nav-item").forEach((button) => {
        button.classList.toggle("active", button.dataset.screen === state.currentScreen);
      });

      if (state.currentScreen === "recommend") {
        renderRecommendScreen();
        return;
      }
      if (state.currentScreen === "courses") {
        renderCoursesScreen();
        return;
      }
      if (state.currentScreen === "history") {
        renderHistoryScreen();
        return;
      }
      renderResultsScreen();
    }

    function renderRecommendScreen() {
      content.innerHTML = `
        <div class="stack">
          <section class="hero">
            <h2>Course Match</h2>
            <p>Fill in your profile, then generate ranked courses.</p>
          </section>

          <section class="card">
            <div class="card-body">
              <form id="recommendForm" class="stack">
                <div class="section">
                  <h3 class="section-heading">Student</h3>
                  <label class="input-group">
                    <span>Name</span>
                    <input id="studentName" name="studentName" type="text" placeholder="Enter your name" autocomplete="off">
                  </label>
                </div>

                <div class="section">
                  <h3 class="section-heading">Academic Scores</h3>
                  <div class="grid-2">
                    <label class="input-group">
                      <span>Math</span>
                      <input id="mathGrade" name="mathGrade" type="number" min="0" max="100" placeholder="0-100">
                    </label>
                    <label class="input-group">
                      <span>Science</span>
                      <input id="scienceGrade" name="scienceGrade" type="number" min="0" max="100" placeholder="0-100">
                    </label>
                    <label class="input-group">
                      <span>English</span>
                      <input id="englishGrade" name="englishGrade" type="number" min="0" max="100" placeholder="0-100">
                    </label>
                    <label class="input-group">
                      <span>CET (optional)</span>
                      <input id="cetScore" name="cetScore" type="number" min="0" max="100" placeholder="0-100">
                    </label>
                  </div>
                </div>

                <div class="section">
                  <h3 class="section-heading">Interest</h3>
                  <label class="input-group">
                    <span>Select interest area</span>
                    <select id="interestSelect" name="interest">
                      ${interestOptions.map((option) => '<option value="' + escapeHtml(option) + '">' + escapeHtml(option) + "</option>").join("")}
                    </select>
                  </label>
                </div>

                ${traitPanel("Strengths", "Pick traits that describe you best", "strengths", strengthOptions, state.selectedStrengths)}
                ${traitPanel("Skills", "Choose current skills", "skills", skillOptions, state.selectedSkills)}
                ${traitPanel("Weaknesses", "Select areas you want to improve", "weaknesses", weaknessOptions, state.selectedWeaknesses)}

                <button class="button button-primary" type="submit">Generate Recommendation</button>
              </form>
            </div>
          </section>
        </div>
      `;

      document.getElementById("interestSelect").value = state.selectedInterest;
      document.getElementById("recommendForm").addEventListener("submit", onGenerate);
      bindChipToggle("strengths", state.selectedStrengths);
      bindChipToggle("skills", state.selectedSkills);
      bindChipToggle("weaknesses", state.selectedWeaknesses);
      document.getElementById("interestSelect").addEventListener("change", (event) => {
        state.selectedInterest = event.target.value;
      });
    }

    function traitPanel(title, subtitle, key, options, selectedSet) {
      return `
        <section class="soft-panel section">
          <div>
            <h3 class="section-heading">${escapeHtml(title)}</h3>
            <p class="muted small">${escapeHtml(subtitle)}</p>
          </div>
          <div class="chips" data-chip-group="${escapeHtml(key)}">
            ${options.map((option) => {
              const selected = selectedSet.has(option) ? " selected" : "";
              return '<button class="chip' + selected + '" type="button" data-value="' + escapeHtml(option) + '">' + escapeHtml(option) + "</button>";
            }).join("")}
          </div>
        </section>
      `;
    }

    function bindChipToggle(groupName, targetSet) {
      const group = document.querySelector('[data-chip-group="' + groupName + '"]');
      if (!group) return;
      group.addEventListener("click", (event) => {
        const button = event.target.closest(".chip");
        if (!button) return;
        const value = button.dataset.value;
        if (targetSet.has(value)) {
          targetSet.delete(value);
          button.classList.remove("selected");
        } else {
          targetSet.add(value);
          button.classList.add("selected");
        }
      });
    }

    function parseScore(rawValue, label, required) {
      const trimmed = rawValue.trim();
      if (!trimmed) {
        if (required) {
          throw new Error(label + " is required.");
        }
        return null;
      }
      const parsed = Number(trimmed);
      if (!Number.isFinite(parsed) || !Number.isInteger(parsed)) {
        throw new Error(label + " must be a whole number.");
      }
      if (parsed < 0 || parsed > 100) {
        throw new Error(label + " must be between 0 and 100.");
      }
      return parsed;
    }

    function onGenerate(event) {
      event.preventDefault();

      try {
        const studentName = document.getElementById("studentName").value.trim();
        if (studentName.length < 2) {
          throw new Error("Enter the student's full name.");
        }

        const input = {
          studentName,
          mathGrade: parseScore(document.getElementById("mathGrade").value, "Math", true),
          scienceGrade: parseScore(document.getElementById("scienceGrade").value, "Science", true),
          englishGrade: parseScore(document.getElementById("englishGrade").value, "English", true),
          cetScore: parseScore(document.getElementById("cetScore").value, "CET", false),
          interest: state.selectedInterest,
          strengths: Array.from(state.selectedStrengths),
          skills: Array.from(state.selectedSkills),
          weaknesses: Array.from(state.selectedWeaknesses)
        };

        const results = generateRecommendations(input);
        storeSession(input, results);
        state.resultsSession = {
          studentName: input.studentName,
          results: results.slice(0, 10)
        };
        state.currentScreen = "results";
        render();
      } catch (error) {
        window.alert(error.message);
      }
    }

    function renderCoursesScreen() {
      const query = state.courseQuery.trim().toLowerCase();
      const filtered = courses
        .filter((course) => {
          if (!query) return true;
          return (
            course.name.toLowerCase().includes(query) ||
            course.code.toLowerCase().includes(query) ||
            course.category.toLowerCase().includes(query)
          );
        })
        .sort((a, b) => a.name.localeCompare(b.name));

      content.innerHTML = `
        <div class="stack">
          <section class="soft-panel">
            <strong>${courses.length} available programs</strong>
          </section>
          <label class="input-group">
            <span class="hidden">Search</span>
            <input id="courseSearch" type="text" placeholder="Search course, code, or category" value="${escapeHtml(state.courseQuery)}">
          </label>
          <section class="list">
            ${filtered.length ? filtered.map((course) => `
              <article class="list-item" data-course-code="${escapeHtml(course.code)}">
                <h4>${escapeHtml(course.name)}</h4>
                <div class="wrap" style="margin-top: 10px;">
                  <span class="badge">${escapeHtml(course.code)}</span>
                  <span class="badge">${escapeHtml(course.category)}</span>
                </div>
              </article>
            `).join("") : '<div class="empty-state">No course found.</div>'}
          </section>
        </div>
      `;

      document.getElementById("courseSearch").addEventListener("input", (event) => {
        state.courseQuery = event.target.value;
        renderCoursesScreen();
      });

      content.querySelectorAll("[data-course-code]").forEach((item) => {
        item.addEventListener("click", () => {
          const course = courses.find((entry) => entry.code === item.dataset.courseCode);
          openCourseModal(course);
        });
      });
    }

    function renderHistoryScreen() {
      const history = loadHistory();

      content.innerHTML = `
        <div class="stack">
          ${history.length ? `
            <section class="hero" style="background: linear-gradient(135deg, #6aa4b7 0%, #3f86a0 100%);">
              <h2>${history.length} saved recommendation sessions</h2>
              <p>Review previous student profiles and top matches.</p>
            </section>
            <section class="list">
              ${history.map((entry) => `
                <article class="list-item history-block" data-history-id="${entry.id}">
                  <div class="row-between history-head">
                    <span class="badge">${escapeHtml(formatDate(entry.createdAt))}</span>
                    <button class="button button-danger history-delete" data-delete-id="${entry.id}" type="button">Delete</button>
                  </div>
                  <div>
                    <h4>${escapeHtml(entry.studentName || "Unnamed Student")}</h4>
                    <div class="wrap" style="margin-top: 10px;">
                      ${scoreMetaChip("M " + entry.mathGrade)}
                      ${scoreMetaChip("S " + entry.scienceGrade)}
                      ${scoreMetaChip("E " + entry.englishGrade)}
                      ${entry.cetScore !== null ? scoreMetaChip("CET " + entry.cetScore) : ""}
                      ${scoreMetaChip(entry.interest)}
                    </div>
                  </div>
                  ${entry.strengths.length ? '<p class="small"><strong>Strengths:</strong> ' + escapeHtml(entry.strengths.join(", ")) + "</p>" : ""}
                  ${entry.skills.length ? '<p class="small"><strong>Skills:</strong> ' + escapeHtml(entry.skills.join(", ")) + "</p>" : ""}
                  ${entry.weaknesses.length ? '<p class="small"><strong>Weaknesses:</strong> ' + escapeHtml(entry.weaknesses.join(", ")) + "</p>" : ""}
                  <div class="wrap">
                    ${entry.results.slice(0, 3).map((result) => '<span class="badge summary-badge">' + escapeHtml(result.course.code + " " + result.score.toFixed(1)) + "</span>").join("")}
                  </div>
                </article>
              `).join("")}
            </section>
          ` : '<div class="empty-state">No history yet.</div>'}
        </div>
      `;

      content.querySelectorAll(".history-delete").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          const id = Number(button.dataset.deleteId);
          deleteHistory(id);
        });
      });

      content.querySelectorAll("[data-history-id]").forEach((item) => {
        item.addEventListener("click", () => {
          const history = loadHistory();
          const entry = history.find((record) => String(record.id) === item.dataset.historyId);
          if (entry) {
            openHistoryModal(entry);
          }
        });
      });
    }

    function deleteHistory(id) {
      const confirmed = window.confirm("Delete this history entry?");
      if (!confirmed) return;
      const history = loadHistory().filter((entry) => entry.id !== id);
      saveHistory(history);
      renderHistoryScreen();
    }

    function renderResultsScreen() {
      const session = state.resultsSession;
      if (!session) {
        state.currentScreen = "recommend";
        render();
        return;
      }

      content.innerHTML = `
        <div class="stack">
          <section class="hero">
            <h2>${escapeHtml(session.studentName)}</h2>
            <p>${session.results.length} ranked courses based on your profile</p>
          </section>
          <section class="list">
            ${session.results.length ? session.results.map((result, index) => `
              <article class="list-item" data-course-code="${escapeHtml(result.course.code)}">
                <div class="row">
                  <span class="result-rank">${index + 1}</span>
                  <div style="flex: 1; min-width: 0;">
                    <h4>${escapeHtml(result.course.name)}</h4>
                    <p class="muted small">${escapeHtml(result.course.category)} | ${escapeHtml(result.course.code)}</p>
                  </div>
                  <strong style="color: var(--primary); font-size: 1rem;">${result.score.toFixed(1)}</strong>
                </div>
                <div class="progress">
                  <div class="progress-fill" style="width: ${result.score}%;"></div>
                </div>
                ${result.interestMatched ? '<div class="wrap" style="margin-top: 10px;"><span class="badge summary-badge">Interest matched</span></div>' : ""}
              </article>
            `).join("") : '<div class="empty-state">No recommendations found.</div>'}
          </section>
        </div>
      `;

      content.querySelectorAll("[data-course-code]").forEach((item) => {
        item.addEventListener("click", () => {
          const course = courses.find((entry) => entry.code === item.dataset.courseCode);
          openCourseModal(course);
        });
      });
    }

    function openCourseModal(course) {
      if (!course) return;
      modalRoot.classList.remove("hidden");
      modalRoot.innerHTML = `
        <div class="modal" id="activeModal">
          <section class="sheet">
            <div class="sheet-head row-between">
              <div>
                <h3>${escapeHtml(course.name)}</h3>
                <div class="wrap" style="margin-top: 10px;">
                  <span class="badge">${escapeHtml(course.code)}</span>
                  <span class="badge">${escapeHtml(course.category)}</span>
                </div>
              </div>
              <button class="icon-button" type="button" id="closeModalButton">Close</button>
            </div>
            <div class="sheet-body">
              <p>${escapeHtml(course.description)}</p>
            </div>
          </section>
        </div>
      `;

      bindModalClose();
    }

    function openHistoryModal(entry) {
      modalRoot.classList.remove("hidden");
      modalRoot.innerHTML = `
        <div class="modal" id="activeModal">
          <section class="sheet">
            <div class="sheet-head row-between">
              <div>
                <h3>${escapeHtml(entry.studentName || "Unnamed Student")}</h3>
                <p class="muted small">${escapeHtml(formatDate(entry.createdAt))}</p>
              </div>
              <button class="icon-button" type="button" id="closeModalButton">Close</button>
            </div>
            <div class="sheet-body stack">
              <div class="wrap">
                ${scoreMetaChip("M " + entry.mathGrade)}
                ${scoreMetaChip("S " + entry.scienceGrade)}
                ${scoreMetaChip("E " + entry.englishGrade)}
                ${entry.cetScore !== null ? scoreMetaChip("CET " + entry.cetScore) : ""}
                ${scoreMetaChip(entry.interest)}
              </div>
              ${entry.strengths.length ? '<p class="small"><strong>Strengths:</strong> ' + escapeHtml(entry.strengths.join(", ")) + "</p>" : ""}
              ${entry.skills.length ? '<p class="small"><strong>Skills:</strong> ' + escapeHtml(entry.skills.join(", ")) + "</p>" : ""}
              ${entry.weaknesses.length ? '<p class="small"><strong>Weaknesses:</strong> ' + escapeHtml(entry.weaknesses.join(", ")) + "</p>" : ""}
              <div class="stack">
                ${entry.results.map((result, index) => `
                  <article class="list-item">
                    <div class="row">
                      <span class="result-rank">${index + 1}</span>
                      <div style="flex: 1;">
                        <h4>${escapeHtml(result.course.name)}</h4>
                        <p class="muted small">${escapeHtml(result.course.category)} | ${escapeHtml(result.course.code)}</p>
                      </div>
                      <strong style="color: var(--primary);">${result.score.toFixed(1)}</strong>
                    </div>
                  </article>
                `).join("")}
              </div>
            </div>
          </section>
        </div>
      `;

      bindModalClose();
    }

    function bindModalClose() {
      const activeModal = document.getElementById("activeModal");
      document.getElementById("closeModalButton").addEventListener("click", closeModal);
      activeModal.addEventListener("click", (event) => {
        if (event.target === activeModal) {
          closeModal();
        }
      });
    }

    function closeModal() {
      modalRoot.innerHTML = "";
      modalRoot.classList.add("hidden");
    }

    bottomNav.addEventListener("click", (event) => {
      const button = event.target.closest(".nav-item");
      if (!button) return;
      state.currentScreen = button.dataset.screen;
      render();
    });

    backButton.addEventListener("click", () => {
      state.currentScreen = "recommend";
      render();
    });

    render();
  </script>
</body>
</html>
